name: Package refined Netlify deploy

on:
  workflow_dispatch:
  push:
    branches:
      - recovered-deploy
    paths:
      - ".github/workflows/package-refined.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate refinements
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          grep -q "S&D recovery refinement pass" _next/static/chunks/37cw2ohdsvjyh.css
          grep -q "scrub:1.35" _next/static/chunks/20ywuormos27l.js
          ! grep -q '>undefined</p>' services/digital-web.html
          ! grep -q 'Brand strategy and design for the experience economy.' services/brand-strategy-design.html
          ! grep -q 'Campaigns and content for the experience economy.' services/campaigns-content.html
          ! grep -q 'Websites and digital journeys for the experience economy.' services/digital-web.html

      - name: Build Netlify upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          rm -f release/smithanddevil-refined.zip
          printf '[build]\n  command = "echo Static site ready"\n  publish = "."\n' > netlify.toml
          zip -qr release/smithanddevil-refined.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "release/*" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "next.config.ts" \
            -x "tsconfig.json" \
            -x "tsconfig.tsbuildinfo" \
            -x "eslint.config.mjs" \
            -x "AGENTS.md" \
            -x "CLAUDE.md" \
            -x "DEPLOY.md" \
            -x "README.md"

      - name: Commit package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/smithanddevil-refined.zip
          git commit -m "Package refined Netlify deploy"
          git push




