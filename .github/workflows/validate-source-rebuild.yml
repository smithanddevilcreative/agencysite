name: Validate recovered source

on:
  push:
    branches:
      - source-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-recovery-parity.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/serve-static-export.mjs >/tmp/sd-http.log 2>&1 &
      - run: node scripts/verify-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-site-build
          path: out
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-site-qa-screenshots
          path: qa-screenshots
          retention-days: 14
          if-no-files-found: ignore
