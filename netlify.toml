# Netlify build settings.
#
# The site is a Next.js static export (see next.config.ts), so there is no
# server runtime to configure — Netlify just publishes the `out` folder and
# resolves /studio to studio.html itself.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
